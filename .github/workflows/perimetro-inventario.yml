# O INVENTÁRIO DO PERÍMETRO — F1, fatia 1.1: medir a entidade antes de mexer nela.
#
# POR QUE ESTE WORKFLOW EXISTE, e por que ele é DISPARO MANUAL, não agendado. A F1 (entidade e
# perímetro) começou em 18/09/2026 contra uma estimativa de "55%" que ninguém tinha reconferido
# desde 09/09 — a mesma classe de erro que o `sonda-producao.yml` existe para não deixar acontecer
# de novo, só que do lado da ENTIDADE em vez do lado do CATÁLOGO. A diferença para a sonda é o
# ritmo: schema pode ficar defasado de produção em silêncio dia após dia, e por isso a sonda é
# diária; a entidade de um mandato muda quando o mandato muda (documento novo, mandato novo), não
# no relógio — então disparo manual (ou no começo de cada rodada da F1) é a cadência certa. Um
# agendamento diário aqui só acumularia execuções idênticas.
#
# O QUE ELE RODA, e por que os dois passos: `perimetro-inventario.mjs` classifica a CAUSA de cada
# pendência `entidade_incorreta` aberta — sem isso, "71 pendências" é contagem, não diagnóstico
# (regra 1). `Supabase/test/*.test.mjs` prova que a classificação continua batendo com a fixture
# real de 18/09/2026 ANTES de confiar no que a execução contra produção vai dizer — se a suíte
# reprovasse, o número contra produção seria lido com uma régua que mudou sem aviso.
#
# MESMO SEGREDO DA SONDA (`SONDA_DB_URL`), porque é o mesmo requisito: leitura, transação somente-
# leitura (o script abre `start transaction read only` antes de cada consulta, desde 24/09/2026),
# papel somente-leitura basta. Este job NÃO tem Postgres: por isso não define `TESTE_PSQL`, e os
# testes do executor que precisam de banco se declaram NÃO CONFERIDOS aqui (quem os exige é o
# `suites.yml`).

name: Inventário do perímetro (F1.1)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventario:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cliente psql (o da imagem do runner, sem apt)
        # Até 11/11/2026 este passo instalava o postgresql-client-16 pelo apt-get. A imagem 26.04 não
        # tem o pacote 16 e o CI já caía no cliente 18 desde 04/11 (ver Supabase/test/run.sh). Em 11/11
        # o DNS do runner deixou de resolver *.ubuntu.com e o apt derrubou banco, e2e e variacoes em 4
        # execuções seguidas (#289 e #290), antes de qualquer teste. A imagem já traz o PostgreSQL 18.6
        # (manifesto Ubuntu2604-Readme, versão 20261101.186): o apt baixava só um metapacote de 15 kB.
        # Exigir major >= 16 faz uma troca de imagem sem psql reprovar em voz alta aqui.
        run: |
          v="$(psql --version | grep -oE '[0-9]+' | head -1)"
          echo "psql major: $v"
          test "$v" -ge 16

      - name: A classificação ainda bate com a fixture real (regra 2, antes de confiar no número)
        run: node --test 'Supabase/test/*.test.mjs'

      - name: Conferir o segredo
        env:
          SONDA_DB_URL: ${{ secrets.SONDA_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SONDA_DB_URL:-}" ]; then
            echo "::error::Secret SONDA_DB_URL não cadastrado — esta execução NÃO perguntou nada a produção."
            exit 1
          fi
          echo "segredo presente (o valor nunca é impresso)"

      - name: Entidades por caso e causa de cada entidade_incorreta aberta
        env:
          CONFERIR_PSQL: psql '${{ secrets.SONDA_DB_URL }}'
        run: node Supabase/test/perimetro-inventario.mjs
